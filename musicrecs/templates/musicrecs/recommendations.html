{% extends 'musicrecs/base.html' %}

{% block title %}Recommendations{% endblock %}

{% block content %}
<h2>Recommendations for "{{ track_name }}"</h2>
<ul>
    {% for track in recommendations %}
        <li>{{ track }}</li>
    {% empty %}
        <p>No recommendations available.</p>
    {% endfor %}
</ul>
{% endblock %}
